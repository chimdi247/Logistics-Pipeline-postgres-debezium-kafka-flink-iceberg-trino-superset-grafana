global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: atlasflow
    environment: ubuntu-vm

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: kafka-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: container-metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Flink built-in Prometheus reporter (JobManager + TaskManager).
  - job_name: flink
    scrape_interval: 15s
    static_configs:
      - targets: ["flink-jobmanager:9249"]
        labels: {component: jobmanager}
      - targets: ["flink-taskmanager:9249"]
        labels: {component: taskmanager}

  - job_name: loki
    scrape_interval: 30s
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    scrape_interval: 30s
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    scrape_interval: 30s
    static_configs:
      - targets: ["grafana:3000"]

  # Application HTTP reachability checks. These test endpoints, not semantic correctness.
  - job_name: http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://connect:8083/connectors"]
        labels: {service: kafka-connect}
      - targets: ["http://iceberg-rest:8181/v1/config"]
        labels: {service: iceberg-rest}
      - targets: ["http://flink-jobmanager:8081/overview"]
        labels: {service: flink-jobmanager}
      - targets: ["http://object-store:9000/health/ready"]
        labels: {service: rustfs}
      - targets: ["http://trino:8080/v1/info"]
        labels: {service: trino}
      - targets: ["http://superset:8088/health"]
        labels: {service: superset}
      - targets: ["http://prometheus:9090/-/healthy"]
        labels: {service: prometheus-health}
      - targets: ["http://grafana:3000/api/health"]
        labels: {service: grafana}
      - targets: ["http://loki:3100/ready"]
        labels: {service: loki}
      - targets: ["http://alloy:12345/-/ready"]
        labels: {service: alloy}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP checks for brokers and SQL metadata databases; no credentials are required.
  - job_name: tcp-probes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["kafka:19092"]
        labels: {service: kafka-broker}
      - targets: ["postgres:5432"]
        labels: {service: operational-postgres}
      - targets: ["superset-db:5432"]
        labels: {service: superset-postgres}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
