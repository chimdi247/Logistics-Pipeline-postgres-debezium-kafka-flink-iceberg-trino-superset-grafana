apiVersion: 1

datasources:
  - name: AtlasFlow Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
      timeout: 60
      # Lets Explore / Logs Drilldown jump from a log line to the matching Prometheus series.
      derivedFields: []
